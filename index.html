<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ParkSense – สถานะที่จอดรถ ชั้น 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">

        <!-- ส่วนหัว: ชื่อระบบ สถานะการเชื่อมต่อ และจำนวนช่องว่าง/ไม่ว่าง -->
        <div class="hero">
            <header>
                <div class="lg">
                    <i>P</i>
                    <div>
                        <b>ParkSense</b>
                        <small>สถานะที่จอดรถ</small>
                    </div>
                </div>
                <div class="rt">
                    <span class="live off" id="live"><b></b><span id="lt">รอข้อมูลจากบอร์ด</span></span>
                    <span id="clk"></span>
                </div>
            </header>
            <div class="sum">
                <div class="c g">
                    <span class="lamp g"></span>
                    <span>ว่าง</span>
                    <b id="nfree">–</b>
                </div>
                <div class="c r">
                    <span class="lamp r"></span>
                    <span>ไม่ว่าง</span>
                    <b id="nocc">–</b>
                </div>
            </div>
        </div>

        <!-- การ์ดชั้น 1: ผังช่องจอด 3 ช่อง (app.js วาดลงในกล่อง #pv และ #slots) -->
        <div class="grid">
            <div class="fc" id="fc">
                <div class="hd">
                    <span class="fn">1</span>
                    <b>ชั้น 1</b>
                    <span class="lamp n" id="lp"></span>
                    <div class="pls">
                        <span class="pill g">ว่าง <em id="a">–</em></span>
                        <span class="pill r">ไม่ว่าง <em id="b">–</em></span>
                    </div>
                </div>
                <div class="pv" id="pv"></div>
                <div class="slots" id="slots"></div>
            </div>
        </div>

        <!-- คำอธิบายสี -->
        <div class="lgd">
            <span><i style="background:#22c55e55;border:2px solid #16a34a"></i>ว่าง</span>
            <span><i style="background:#ef444430;border:1px solid var(--tx)"></i>มีรถจอด</span>
            <span><i style="background:#94a3b822;border:1px dashed #94a3b8"></i>รอข้อมูล</span>
        </div>
        <p class="upd" id="upd">ยังไม่ได้รับข้อมูลจากบอร์ด</p>
    </div>
<script>
  // 1. นำรหัส 2 ตัวจากขั้นตอนที่ 1 มาวางแทนที่ตรงนี้
  const TB_PUBLIC_ID = "วาง_Public_ID_ที่นี่";
  const TB_DEVICE_ID = "วาง_Device_ID_ที่นี่";
  const TB_HOST      = "https://thingsboard.cloud";

  let jwtToken = null;

  // ขอ Token แบบ Public (อ่านได้อย่างเดียว)
  async function getPublicToken() {
    const res = await fetch(`${TB_HOST}/api/auth/login/public`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ publicId: TB_PUBLIC_ID })
    });
    const data = await res.json();
    jwtToken = data.token;
  }

  // ดึงค่าล่าสุดจาก Parking Gateway
  async function fetchParkingData() {
    try {
      if (!jwtToken) await getPublicToken();

      const url = `${TB_HOST}/api/plugins/telemetry/DEVICE/${TB_DEVICE_ID}/values/timeseries?keys=node,obj,bat`;
      const res = await fetch(url, {
        headers: { "X-Authorization": `Bearer ${jwtToken}` }
      });

      // หาก Token หมดอายุ ให้ขอใหม่
      if (res.status === 401) {
        await getPublicToken();
        return;
      }

      const data = await res.json();
      if (data.obj && data.obj.length > 0) {
        const objVal = Number(data.obj[0].value);
        const isOccupied = (objVal === 0); // 0 = มีรถจอด (ไม่ว่าง), 1 = ไม่มีรถ (ว่าง)

        console.log("อัปเดตสถานะช่อง 01:", isOccupied ? "ไม่ว่าง (0)" : "ว่าง (1)");
        
        // *** เรียกฟังก์ชันอัปเดตหน้าเว็บช่อง 01 ของคุณตรงนี้ ***
        updateSlot01UI(isOccupied);
      }
    } catch (err) {
      console.error("เชื่อมต่อ ThingsBoard ไม่สำเร็จ:", err);
    }
  }

  // ฟังก์ชันตัวอย่างสำหรับเปลี่ยนข้อความ/สีในหน้าเว็บ (ปรับชื่อ ID ให้ตรงกับ HTML ของคุณ)
  function updateSlot01UI(isOccupied) {
    // ตัวอย่าง: เปลี่ยนข้อความ "รอข้อมูล" เป็น "ไม่ว่าง" หรือ "ว่าง"
    // หากคุณส่งไฟล์ index.html มา ผมจะแก้ชื่อตัวแปรตรงนี้ให้ตรงกับหน้าเว็บของคุณ 100%
  }

  // สั่งดึงข้อมูลทันทีที่เปิดเว็บ และอัปเดตซ้ำทุก 2 วินาที
  fetchParkingData();
  setInterval(fetchParkingData, 2000);
</script>
    <script src="app.js"></script>
</body>
</html>
