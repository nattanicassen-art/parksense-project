<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkSense - Admin Control Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; padding: 20px; color: #f8fafc; }
    .container { max-width: 1100px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #334155; }
    .header h1 { color: #38bdf8; font-size: 24px; }
    .admin-badge { background: #ef4444; color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 12px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
    .spot-card { border: 2px solid #334155; background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; }
    .spot-card.available { border-color: #10b981; }
    .spot-card.occupied { border-color: #ef4444; }
    .spot-card.reserved { border-color: #3b82f6; }
    
    .spot-name { font-weight: bold; font-size: 20px; margin-bottom: 5px; color: white; }
    .spot-status { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
    
    .status-available { color: #10b981; }
    .status-occupied { color: #ef4444; }
    .status-reserved { color: #3b82f6; }

    .admin-controls { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
    .btn { border: none; padding: 6px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
    .btn-green { background: #10b981; } .btn-green:hover { background: #059669; }
    .btn-red { background: #ef4444; } .btn-red:hover { background: #dc2626; }
    .btn-blue { background: #3b82f6; } .btn-blue:hover { background: #2563eb; }
    
    .log-box { margin-top: 25px; background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; color: #94a3b8; max-height: 100px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚙️ ParkSense (Admin Control Panel)</h1>
      <span class="admin-badge">ADMIN MODE</span>
    </div>

    <p style="color: #94a3b8; font-size: 14px;">แผงควบคุมแอดมิน: สามารถกดปรับเปลี่ยนสถานะช่องจอดแบบ Manual ได้จากที่นี่</p>

    <div class="grid">
      <div class="spot-card available" id="card-A-01">
        <div class="spot-name">A-01</div>
        <div class="spot-status status-available" id="status-A-01">ว่าง</div>
        <div class="admin-controls">
          <button class="btn btn-green" onclick="setSpot('A-01', 'Available')">ว่าง</button>
          <button class="btn btn-red" onclick="setSpot('A-01', 'Occupied')">ไม่ว่าง</button>
          <button class="btn btn-blue" onclick="setSpot('A-01', 'Reserved')">จอง</button>
        </div>
      </div>

      <div class="spot-card occupied" id="card-A-02">
        <div class="spot-name">A-02</div>
        <div class="spot-status status-occupied" id="status-A-02">ไม่ว่าง</div>
        <div class="admin-controls">
          <button class="btn btn-green" onclick="setSpot('A-02', 'Available')">ว่าง</button>
          <button class="btn btn-red" onclick="setSpot('A-02', 'Occupied')">ไม่ว่าง</button>
          <button class="btn btn-blue" onclick="setSpot('A-02', 'Reserved')">จอง</button>
        </div>
      </div>
    </div>

    <div class="log-box" id="system-log">
      > [System Status] Admin Connected to ParkSense Dashboard...<br>
    </div>
  </div>

  <script>
    function setSpot(spotId, status) {
      const card = document.getElementById(`card-${spotId}`);
      const statusText = document.getElementById(`status-${spotId}`);
      const log = document.getElementById('system-log');

      card.className = "spot-card " + status.toLowerCase();

      if (status === 'Available') {
        statusText.innerText = "ว่าง";
        statusText.className = "spot-status status-available";
      } else if (status === 'Occupied') {
        statusText.innerText = "ไม่ว่าง";
        statusText.className = "spot-status status-occupied";
      } else if (status === 'Reserved') {
        statusText.innerText = "จองแล้ว";
        statusText.className = "spot-status status-reserved";
      }

      const time = new Date().toLocaleTimeString();
      log.innerHTML = `> [${time}] Admin Override: ${spotId} set to ${status}<br>` + log.innerHTML;
    }
  </script>
</body>
</html>
