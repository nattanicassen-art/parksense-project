<!DOCTYPE html>
<html lang="th">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkSense - Live Connected Admin Control Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Thonburi, Tahoma, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
    
    .admin-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
    .admin-title { font-size: 22px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
    .badge-admin { background: #ef4444; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    
    /* สรุป 3 ตัวเลขหลัก */
    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 15px; }
    .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
    .stat-num { font-size: 24px; font-weight: bold; margin-top: 5px; }
    .text-green { color: #10b981; } .text-red { color: #ef4444; } .text-yellow { color: #f59e0b; }

    .floors-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    .floor-card { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 15px; transition: 0.3s; }
    .floor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #334155; }
    .floor-title { font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 6px; }

    .floor-actions { display: flex; gap: 5px; }
    .btn-xs { border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .btn-full { background: #ef4444; color: white; }
    .btn-reset { background: #475569; color: white; }

    /* ปรับเป็น 3 คอลัมน์ให้เรียงสวยพอดีกับ 3 ช่อง */
    .slots-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background: #0f172a; padding: 12px; border-radius: 8px; }
    .slot { border: 2px solid #334155; background: #1e293b; border-radius: 8px; padding: 14px 8px; text-align: center; cursor: pointer; user-select: none; transition: 0.2s; position: relative; }
    .slot:hover { transform: translateY(-2px); border-color: #38bdf8; }
    .slot-id { font-weight: bold; font-size: 15px; }
    .slot-state { font-size: 12px; margin-top: 4px; }

    .slot.available { border-color: #10b981; background: rgba(16, 185, 129, 0.1); color: #10b981; }
    .slot.occupied { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    .slot.error { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
